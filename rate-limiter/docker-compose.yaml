services:

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - fastapi
      - prometheus
      - grafana
      - locust
    restart: unless-stopped

  locust:
    build: 
      context: ./load-test
      dockerfile: Dockerfile
    container_name: locust
    ports:
      - "8089:8089"
    depends_on:
      - fastapi
    restart: unless-stopped