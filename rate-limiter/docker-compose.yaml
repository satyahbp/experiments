services:

  fastapi:
    build:
      context: ./app
    container_name: fastapi-app
    ports:
      - "8000:8000"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - fastapi
      - prometheus
      - grafana
      - locust
    restart: unless-stopped
    
  prometheus:
    build:
      context: ./prometheus
    container_name: prometheus-app
    ports:
      - "9090:9090"
    depends_on:
      - fastapi
    command: 
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/

  postgres:
    build: ./postgresql
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: "postgres:5432/school?sslmode=disable"
      DATA_SOURCE_USER: admin
      DATA_SOURCE_PASS: password
    command:
      - "--collector.stat_statements"
      - "--collector.stat_statements.include_query"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command: 
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - '/:/host:ro,rslave,z'

  grafana:
    build: ./grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: none
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

  locust:
    build: 
      context: ./load-test
      dockerfile: Dockerfile
    container_name: locust
    ports:
      - "8089:8089"
    depends_on:
      - fastapi
    restart: unless-stopped