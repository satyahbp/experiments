global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "CONFIG_IP:8000"
  
  - job_name: "postgres"
    static_configs:
      - targets:
        - "CONFIG_IP:9187"
  
  - job_name: "node-exporter"
    static_configs:
      - targets:
        - "CONFIG_IP:9100"