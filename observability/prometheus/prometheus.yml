global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["fastapi:8000"]
  
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
  
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]